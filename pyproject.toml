[project]
name = "github-actions-security-auditor"
version = "0.1.0"
description = "Static security auditor for GitHub Actions workflows: pull_request_target risks, script injection, unpinned actions, secret leaks, write-all permissions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kaan Turan" }]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
github-actions-security-auditor = "github_actions_security_auditor:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["github_actions_security_auditor"]

[tool.ruff]
line-length = 100
target-version = "py39"
